spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

server.error.whitelabel.enabled=false

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cns_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:CnsDev2026}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT secret cố định - không đổi khi restart backend (token vẫn hợp lệ)
jwt.secret=${JWT_SECRET:CnsDev2026JwtSecretKeyForCnsShop32Chars!}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
