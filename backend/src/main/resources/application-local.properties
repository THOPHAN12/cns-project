# === CẤU HÌNH CHẠY LOCAL - KHÔNG CẦN POSTGRESQL ===
# Chạy với: --spring.profiles.active=local

# JWT secret cố định (token hợp lệ sau khi restart backend)
jwt.secret=CnsDev2026JwtSecretKeyForCnsShop32Chars!

# H2 Database - lưu file trong thư mục backend/data/
spring.datasource.url=jdbc:h2:file:./data/cns_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (xem dữ liệu tại http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
