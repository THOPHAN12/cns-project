services:
  postgres:
    image: postgres:16-alpine
    container_name: cns-postgres
    environment:
      POSTGRES_DB: cns_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CnsDev2026
    volumes:
      - cns_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cns_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cns-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cns_db
      DB_USERNAME: postgres
      DB_PASSWORD: CnsDev2026
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: cns-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: cns-ngrok
    command: http backend:8080
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - ngrok

volumes:
  cns_pgdata:
